<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluación Postquirúrgica, Balances & Tests Clínicos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <main class="max-w-4xl mx-auto space-y-6">
    <header class="border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-sky-400">Control Postquirúrgico & Valoración Funcional</h1>
      <p class="text-slate-400 text-sm mt-1">GPC, Escala Daniels, ROM Goal & Pruebas Ortopédicas</p>
    </header>

    <!-- Selecciones de Región y Cirugía -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
      <div>
        <label for="select-region" class="block text-sm font-medium text-slate-300 mb-2">1. Región Corporal:</label>
        <select id="select-region" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-200 focus:ring-2 focus:ring-sky-500 outline-none">
          <option value="">-- Seleccionar Región --</option>
          <option value="columna">Columna Vertebral</option>
          <option value="miembro_superior">Miembro Superior</option>
          <option value="miembro_inferior">Miembro Inferior</option>
        </select>
      </div>

      <div>
        <label for="select-cirugia" class="block text-sm font-medium text-slate-300 mb-2">2. Intervención / Patología:</label>
        <select id="select-cirugia" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-200 focus:ring-2 focus:ring-sky-500 outline-none disabled:opacity-50" disabled>
          <option value="">-- Selecciona primero una región --</option>
        </select>
      </div>
    </section>

    <!-- Contenedor Principal de la Evaluación -->
    <section id="checklist-container" class="space-y-6 hidden">
      
      <!-- Secciones de Balance Articular (ROM) y Balance Muscular (Daniels) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Bloque 1: Rangos de Movilidad (ROM) -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <h2 class="text-md font-semibold text-amber-400 flex items-center gap-2 border-b border-slate-700 pb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            Rangos de Movilidad (ROM)
          </h2>
          <div id="rom-container" class="space-y-2 text-sm text-slate-300"></div>
        </div>

        <!-- Bloque 2: Balance Muscular (Daniels) -->
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
          <h2 class="text-md font-semibold text-emerald-400 flex items-center gap-2 border-b border-slate-700 pb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            Balance Muscular (Escala Daniels 0-5)
          </h2>
          <div id="daniels-container" class="space-y-3"></div>
        </div>

      </div>

      <!-- Objetivos de Progresión y Criterios de Control -->
      <div class="space-y-3 pt-2">
        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span>
          Objetivos de Progresión y Criterios de Control
        </h2>
        <div id="items-list" class="space-y-3"></div>
      </div>

      <!-- Tests Clínicos Ortopédicos -->
      <div class="space-y-3 pt-4 border-t border-slate-800">
        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-400"></span>
          Tests y Maniobras Clínicas Específicas
        </h2>
        <div id="tests-list" class="space-y-3"></div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
